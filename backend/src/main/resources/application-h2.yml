# Run without MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
waynexo:
  jwt-secret: local-h2-development-secret-only-0123456789
spring:
  datasource:
    url: jdbc:h2:file:./data/waynexo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
