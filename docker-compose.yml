# Optional: MySQL 8 for WAYNEXO (if you don't have MySQL installed).
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: waynexo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: waynexo
      TZ: Asia/Colombo
    ports:
      - "3306:3306"
    volumes:
      - waynexo-mysql:/var/lib/mysql
volumes:
  waynexo-mysql:
